downloads:

  - name: "Sing_Test_URL"
    url: "https://www.twitch.tv/videos/2751172343"
    format: "best"
    archive: false
    extra_args:
      - "--no-check-certificate"
      - "--ignore-errors"
      - "--embed-metadata"

