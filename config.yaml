# =====================================================================
# Twitch Downloader Configuration Reference (Profiles & Metadata)
# Official Docs: https://github.com/yt-dlp/yt-dlp#readme
# =====================================================================

downloads:

  - name: "SingSing_Channel"
    source: "https://www.twitch.tv/singsing"
    format: "bestvideo+bestaudio/best"
    extra_args:
      - "--max-downloads"
      - "5"
      - "--ignore-errors"
      - "--embed-metadata"

  - name: "Sing_Test_URL"
    url: "https://www.twitch.tv/videos/2918476529"
    format: "bestvideo+bestaudio/best"
    extra_args:
      - "--max-downloads"
      - "5"
      - "--ignore-errors"
      - "--embed-metadata"

